ibkr:
  host: "127.0.0.1"
  port: 4002            # IB Gateway: 4002=paper, 4001=live | TWS: 7497=paper, 7496=live
  client_id: 1

ollama:
  model: "mistral"
  timeout: 30

watchlist:
  - AAPL
  - MSFT
  - GOOGL
  - AMZN
  - TSLA
  - NVDA
  - META
  - AMD
  - SPY
  - QQQ
  - SMCI
  - INTC
  - T
  - SOFI
  - BAC
  - NFLX
  - F
  - AAL
  - NVO
  - DELL

strategy:
  scan_interval_seconds: 120
  confidence_threshold: 0.65
  timeframes:
    - 1m
    - 5m
    - 15m
  allow_shorts: false
  allow_longs: true

risk:
  max_daily_loss_pct: 0.03        # halt if down 3% on the day
  max_trade_risk_pct: 0.01        # risk only 1% of NAV per trade
  max_stop_loss_pct: 0.02         # SL clamped to 2% from entry (tight intraday)
  min_rr_ratio: 1.5               # TP at least 1.5× the SL distance (was 2.0)
  max_positions: 3                # no more than 3 open at once
  max_hold_minutes: 120           # auto-close after 2 hours
  max_trades_per_day: 5           # stop after 5 trades per day
  max_consecutive_losses: 3       # pause after 3 losses in a row

performance:
  daily_pnl_target: 100.0
  goal_escalation_pct: 0.05
  cool_down_minutes: 120
  cool_down_win_rate_threshold: 0.30

logging:
  level: "INFO"
  file: "logs/trading_bot.log"
  rotation: "100 MB"
